<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 100" width="80" height="100">
  <defs>
    <linearGradient id="silver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c0c0c0"/>
      <stop offset="50%" style="stop-color:#e8e8e8"/>
      <stop offset="100%" style="stop-color:#a0a0a0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="0.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Trunk -->
  <path d="M38 85 L42 85 L42 55 Q40 50 38 45 L38 85" fill="url(#silver)"/>
  <!-- Branches -->
  <path d="M40 45 L25 25 L20 15" stroke="url(#silver)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M40 45 L55 28 L60 18" stroke="url(#silver)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M40 45 L35 20 L32 10" stroke="url(#silver)" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M40 45 L45 22 L48 12" stroke="url(#silver)" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- LED nodes -->
  <circle cx="20" cy="15" r="3" fill="#00d4ff" filter="url(#glow)"/>
  <circle cx="60" cy="18" r="3" fill="#00d4ff" filter="url(#glow)"/>
  <circle cx="32" cy="10" r="2.5" fill="#00d4ff" filter="url(#glow)"/>
  <circle cx="48" cy="12" r="2.5" fill="#00d4ff" filter="url(#glow)"/>
  <circle cx="25" cy="25" r="2" fill="#00d4ff" filter="url(#glow)"/>
  <circle cx="55" cy="28" r="2" fill="#00d4ff" filter="url(#glow)"/>
</svg>
