name: CI
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tasks_db
        ports:
          - 5432:5432
        options: >
          --health-cmd "pg_isready --username=postgres --dbname=tasks_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r docs/module-7-solution-taches/requirements.txt
      - name: Run lint
        run: |
          cd docs/module-7-solution-taches
          pylint -rn tasks
          black --check .
          mypy tasks
      - name: Run tests
        run: |
          cd docs/module-7-solution-taches
          pytest --maxfail=1 --disable-warnings -q
      - name: Run sphinx docs build
        run: |
          cd docs/module-7-solution-taches
          sphinx-build -b html . _build
