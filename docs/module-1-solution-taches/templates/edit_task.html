{% extends "base.html" %}

{% block title %}Editer une tache{% endblock %}

{% block content %}
  <section class="card">
    <h2 class="card__title">Editer la tache</h2>

    {% if error %}
      <div class="alert alert--danger" role="alert">
        {{ error }}
      </div>
    {% endif %}

    <form method="POST" action="{{ url_for('edit', task_id=task.id) }}" class="form">
      <div class="form__group">
        <label for="titre">Titre</label>
        <input id="titre" name="titre" type="text" maxlength="60" required value="{{ task.titre }}" />
      </div>

      <div class="form__group">
        <label for="echeance">Echeance (optionnel)</label>
        <input id="echeance" name="echeance" type="date" value="{{ task.echeance or '' }}" />
      </div>

      <div class="row">
        <button class="btn btn--primary" type="submit">Enregistrer</button>
        <a class="btn" href="{{ url_for('index') }}">Annuler</a>
      </div>
    </form>
  </section>
{% endblock %}
