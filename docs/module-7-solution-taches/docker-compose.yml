version: "3.8"

services:
  web:
    build: ./tasks
    command: gunicorn -w 4 -b 0.0.0.0:8000 wsgi:app
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      - db
      - redis
    restart: always
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tasks_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
  redis:
    image: redis:7
    ports:
      - "6379:6379"
    restart: always

volumes:
  postgres_data:
